spring:
  application:
    name: knightofdarkness
  output:
    ansi:
      enabled: always

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:mydb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  # the world must outlive every deploy: Flyway migrates the schema, Hibernate never changes it
  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    # Signing key for HS512 algorithm
    secret: ${KOD_JWT_SECRET}
    expiration:
      minutes: 60
  cors:
    allowed-origins:
      - https://knightsofdarkness.com

logging:
  level:
    root: INFO

server:
  port: 8080

game:
  seed-dev-accounts: false
