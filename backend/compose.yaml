# The local world's PostgreSQL. bootRun starts it, and the world lives on in the world volume across restarts until
# `docker compose down -v` throws it away. The server tests run on this same image.
name: knightsofdarkness

services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: knightsofdarkness
      POSTGRES_USER: knights
      POSTGRES_PASSWORD: knights
    ports:
      - "5432"
    volumes:
      - world:/var/lib/postgresql

volumes:
  world:
