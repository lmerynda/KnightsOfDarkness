name: Java CI with Gradle

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle.kts
            backend/gradle.properties
            backend/gradle/wrapper/gradle-wrapper.properties
      - name: Build, test and generate coverage
        run: ./gradlew --no-daemon --stacktrace build jacocoTestReport
        working-directory: backend
      - name: Summarize tests and coverage
        if: always()
        shell: python
        env:
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          build = Path("backend/build")
          lines = ["## Backend test results", ""]
          results = sorted((build / "test-results/test").glob("TEST-*.xml"))
          if results:
              suites = [ET.parse(path).getroot() for path in results]
              totals = {key: sum(int(suite.get(key, 0)) for suite in suites)
                        for key in ("tests", "failures", "errors", "skipped")}
              passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
              lines.append(f"{passed} passed; {totals['failures']} failed; "
                           f"{totals['errors']} errors; {totals['skipped']} skipped.")
          else:
              lines.append("JUnit results were not produced. Check the build log for the failed stage.")

          lines += ["", "## Line coverage", ""]
          report = build / "reports/jacoco/test/jacocoTestReport.xml"
          if report.is_file():
              root = ET.parse(report).getroot()
              def coverage(label, counters):
                  covered = sum(int(counter.get("covered", 0)) for counter in counters)
                  missed = sum(int(counter.get("missed", 0)) for counter in counters)
                  total = covered + missed
                  if total:
                      percent = 100 * covered / total
                      outcome = "meets" if percent >= 20 else "below"
                      return f"- {label}: {percent:.1f}% ({covered}/{total} lines); {outcome} the 20% review target."
                  return f"- {label}: no executable lines in the report."

              lines.append(coverage("Overall", root.findall("counter[@type='LINE']")))
              base = os.environ.get("DIFF_BASE_SHA", "")
              changed = subprocess.run(
                  ["git", "diff", "--name-only", base, "HEAD", "--", "backend/src/main/java"],
                  capture_output=True, text=True, check=False
              ) if base and set(base) != {"0"} else None
              if changed is not None and changed.returncode == 0:
                  paths = set(changed.stdout.splitlines())
                  counters = [
                      counter for package in root.findall("package")
                      for source in package.findall("sourcefile")
                      if f"backend/src/main/java/{package.get('name')}/{source.get('name')}" in paths
                      for counter in source.findall("counter[@type='LINE']")
                  ]
                  lines.append(coverage("Changed files", counters))
              else:
                  lines.append("- Changed-file coverage unavailable: no usable comparison commit.")
          else:
              lines.append("Coverage was not produced. A compile or test-startup failure can prevent collection.")
          lines += ["", "When produced, JUnit XML, HTML test reports and JaCoCo reports are retained in the backend-build-evidence artifact."]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
      - name: Retain backend build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-build-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            backend/build/classes/
            backend/build/resources/
            backend/build/test-results/test/
            backend/build/reports/tests/test/
            backend/build/reports/jacoco/test/

  sonar:
    needs: build
    if: >-
      needs.build.result == 'success' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Explain unavailable optional analysis
        if: env.SONAR_TOKEN == ''
        run: echo "SonarCloud analysis skipped because SONAR_TOKEN is not configured. The required backend build and tests passed." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: env.SONAR_TOKEN != ''
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle.kts
            backend/gradle.properties
            backend/gradle/wrapper/gradle-wrapper.properties
      - name: Restore validated classes and reports
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-build-evidence
          path: backend/build
      - name: Analyze validated backend outputs
        if: env.SONAR_TOKEN != ''
        run: ./gradlew --no-daemon --stacktrace sonar -x test
        working-directory: backend
