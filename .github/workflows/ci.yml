# Every check the game has, on every push to master and every pull request into it: the server's tests, the browser's
# build and lint, and the acceptance tests that play the real server in the game's own words, through the API and through
# Chrome.

name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

# a newer push to the same branch or pull request makes the older run moot
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "26.13.0"

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and test
        run: ./gradlew build
        working-directory: backend
      - name: Keep the test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-test-reports
          retention-days: 7
          path: backend/build/reports/tests/test/

  browser:
    name: Browser build and lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: browser/package-lock.json
      - run: npm ci
        working-directory: browser
      # the API types come from api/openapi.json, which the server tests keep true to the server
      - name: API types match the API description
        run: npm run api:check
        working-directory: browser
      - run: npm run build
        working-directory: browser
      - run: npm run ci:lint
        working-directory: browser

  acceptance:
    name: Acceptance
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            browser/package-lock.json
            acceptance/package-lock.json
      # the browser suite builds the pages from browser/
      - run: npm ci
        working-directory: browser
      - run: npm ci
        working-directory: acceptance
      - name: API types match the API description
        run: npm run api:check
        working-directory: acceptance
      - run: npm run typecheck
        working-directory: acceptance
      # each suite builds the server jar itself; the runner image ships the Google Chrome the browser suite drives
      - name: Scenarios and worlds through the API
        run: npm test
        working-directory: acceptance
      # the same races and hostile requests on PostgreSQL, which locks as production does; the runner's Docker holds it
      - name: Races and hostile requests on PostgreSQL
        run: npm run test:pg
        working-directory: acceptance
      - name: Scenarios and page checks through Chrome
        run: npm run test:browser
        working-directory: acceptance
      - name: Keep the screenshots of failed scenarios
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-screenshots
          retention-days: 7
          path: acceptance/test-results/
