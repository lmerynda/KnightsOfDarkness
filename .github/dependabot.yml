# Weekly pull requests that keep every dependency current, one per ecosystem with all its updates grouped; CI runs on
# each, so a green one is safe to merge.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /browser
    schedule:
      interval: weekly
    groups:
      browser:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /simulation
    schedule:
      interval: weekly
    groups:
      simulation:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/", "/backend", "/browser"]
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
