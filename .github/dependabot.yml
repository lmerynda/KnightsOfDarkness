# Weekly pull requests that keep every dependency current, one per ecosystem with all its updates grouped; CI runs on
# each, so a green one is safe to merge.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /browser
    schedule:
      interval: weekly
    groups:
      browser:
        patterns: ["*"]
    # TypeScript 7 is the native compiler without the JavaScript API that openapi-typescript and typescript-eslint call;
    # stay on 6 until they support it
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /simulation
    schedule:
      interval: weekly
    groups:
      simulation:
        patterns: ["*"]
    # TypeScript 7 is the native compiler without the JavaScript API that openapi-typescript calls; stay on 6
    # until it supports it
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: ["/", "/backend", "/browser"]
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
    # the server is built and run on Java 25, the long-term release; a new Java comes in as a deliberate move with the
    # Gradle toolchain and the dev container, not as an image bump
    ignore:
      - dependency-name: azul/zulu-openjdk-alpine
        update-types: ["version-update:semver-major"]

  # the local world's PostgreSQL, whose image the server tests run on too
  - package-ecosystem: docker-compose
    directory: /backend
    schedule:
      interval: weekly
    groups:
      database:
        patterns: ["*"]
    # a new PostgreSQL major cannot open the older one's data without an upgrade, which production has to plan for
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
