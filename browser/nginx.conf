# Same listener as the stock nginx image, plus the single-page app fallback: a reload of
# /kingdom/build must serve index.html and let the client router pick the page.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /art/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
